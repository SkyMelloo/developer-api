name: Documentation Issue
description: The reference is wrong, unclear, or out of date
labels: ["documentation"]
body:
  - type: input
    id: section
    attributes:
      label: Which section
      description: A link or heading from DEVELOPER_API.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong or unclear
      description: What does the doc say, and what does the API actually do (or what's confusing about the wording)?
    validations:
      required: true
